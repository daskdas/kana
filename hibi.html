.font-card strong,.font-card small{font-size:12px}

#theme{display:grid;place-items:center;width:44px;height:44px;padding:0;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:50%}
#theme:hover{background:var(--tint)}
#theme svg{width:22px;height:22px}
#theme .sun-icon,:root[data-theme=dark] #theme .moon-icon{display:none}
:root[data-theme=dark] #theme .sun-icon{display:block}

.category-toolbar{grid-template-columns:minmax(0,1fr);justify-items:start}
.category-toolbar #category-tabs{width:100%}
.category-toolbar #category-tabs button{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:3px 6px;padding-inline:4px}
.pill-count{padding:1px 5px;border:1px solid currentColor;border-radius:999px;font-size:11px;font-variant-numeric:tabular-nums;font-weight:650}
.practice-action #count{color:var(--ink);font-size:15px;font-weight:750}
#bulk-script,#bulk-rows{font-size:13px;font-weight:650}

<main><section id="setup"><div role="tablist" aria-label="Script" class="script-tabs"><button role="tab" id="Hiragana" aria-controls="panel">Hiragana</button><button role="tab" id="Katakana" aria-controls="panel">Katakana</button></div><div id="panel" role="tabpanel"><div class="script-intro"><span id="script-icon" lang="ja" aria-hidden="true"></span><div><h1 id="script-title"></h1><p>Choose kana to practise reading.</p></div></div><div class="practice-action"><strong id="count" role="status"></strong><button id="bulk-script" type="button"></button><button class="primary" id="start">Practice →</button></div><div class="category-toolbar"><div id="category-tabs" role="tablist" aria-label="Kana category"></div><button id="bulk-rows" type="button"></button></div><div id="category-panel" role="tabpanel"></div><fieldset class="font-options" id="kana-font"><legend>Kana font</legend><div class="font-cards"><label class="font-card" data-preview="gothic"><input type="radio" name="kana-font" value="gothic"><span class="font-sample" lang="ja" aria-hidden="true"></span><strong>Gothic</strong><small>Screen</small></label><label class="font-card" data-preview="textbook"><input type="radio" name="kana-font" value="textbook"><span class="font-sample" lang="ja" aria-hidden="true"></span><strong>Kyōkasho</strong><small>Textbook</small></label><label class="font-card" data-preview="mincho"><input type="radio" name="kana-font" value="mincho"><span class="font-sample" lang="ja" aria-hidden="true"></span><strong>Minchō</strong><small>Print</small></label></div></fieldset></div></section>
<section id="drill" hidden><h1>Reading practice</h1><article><div class="bar"><strong id="scriptName"></strong><button id="back">Change rows</button></div><div id="glyph" class="stage" lang="ja"></div><label for="answer">Reading in rōmaji</label><form id="answer-form"><input id="answer" class="input" placeholder="Type the reading" autocorrect="off" enterkeyhint="done" autocomplete="off" autocapitalize="none" spellcheck="false"><button type="submit" class="primary">Check</button></form><p id="feedback" role="status"></p><div class="bar"><button id="reveal">Show answer</button><span id="stats"></span></div></article><details id="chart"><summary>Kana reference</summary><div id="reference"></div></details></section></main></div><div class="layout-preview" id="layout-preview"></div>
<script>
'use strict';
const byId=id=>document.getElementById(id);
const groups=[
 ['Vowels','あいうえお','a i u e o'],['K','かきくけこ','ka ki ku ke ko'],['S','さしすせそ','sa shi su se so'],['T','たちつてと','ta chi tsu te to'],['N','なにぬねの','na ni nu ne no'],['H','はひふへほ','ha hi fu he ho'],['M','まみむめも','ma mi mu me mo'],['Y','やゆよ','ya yu yo'],['R','らりるれろ','ra ri ru re ro'],['W + ん','わをん','wa wo n'],['G','がぎぐげご','ga gi gu ge go'],['Z','ざじずぜぞ','za ji zu ze zo'],['D','だぢづでど','da ji zu de do'],['B','ばびぶべぼ','ba bi bu be bo'],['P','ぱぴぷぺぽ','pa pi pu pe po']
].map(([label,glyphs,sounds])=>({label,cards:[...glyphs].map((g,i)=>[g,sounds.split(' ')[i]])}));
for(const [g,prefix] of Object.entries({'き':'ky','し':'sh','ち':'ch','に':'ny','ひ':'hy','み':'my','り':'ry','ぎ':'gy','じ':'j','び':'by','ぴ':'py'})){
 groups.push({label:prefix+'…',cards:[...'ゃゅょ'].map((suffix,i)=>[g+suffix,prefix+'auo'[i]])});
}
const aliases={し:['si'],ち:['ti'],つ:['tu'],ふ:['hu'],じ:['zi'],ぢ:['di','zi'],づ:['du'],を:['o'],ん:['nn']};
const katakana=g=>[...g].map(c=>String.fromCharCode(c.charCodeAt(0)+96)).join('');
function updateVisibleHeight(){
 const height=window.visualViewport?.height || window.innerHeight;
 document.documentElement.style.setProperty('--visible-height',height+'px');
}
window.visualViewport?.addEventListener('resize',updateVisibleHeight);
updateVisibleHeight();
const scripts=['Hiragana','Katakana'];
function read(key){try{return JSON.parse(localStorage.getItem(key))||{}}catch{return {}}}
const old=read('kanaDesk1'),prefs=read('kanaDesk2');
let script=scripts.includes(prefs.script)?prefs.script:old.mode==='Katakana'?'Katakana':'Hiragana';
const selected=Object.fromEntries(scripts.map(s=>[s,new Set(prefs[s]??(Array.isArray(old.rows)?old.rows:groups.slice(0,10).map((_,i)=>i)))]));
const fontPicker=byId('kana-font');
const fontChoices=[...fontPicker.querySelectorAll('input')];
const initialFont=fontChoices.find(option=>option.value===prefs.font)||fontChoices[0];
initialFont.checked=true;
document.documentElement.dataset.font=initialFont.value;
fontPicker.onchange=event=>{document.documentElement.dataset.font=event.target.value;save()};

function save(){try{localStorage.setItem('kanaDesk2',JSON.stringify({script,font:document.documentElement.dataset.font,theme:document.documentElement.dataset.theme,...Object.fromEntries(scripts.map(s=>[s,[...selected[s]]]))}))}catch{}}
function theme(value){document.documentElement.dataset.theme=value;const button=byId('theme');const label=value==='dark'?'Switch to light mode':'Switch to dark mode';button.setAttribute('aria-label',label);button.title=label}
theme(prefs.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
byId('theme').onclick=()=>{theme(document.documentElement.dataset.theme==='dark'?'light':'dark');save()};
const glyph=g=>script==='Hiragana'?g:katakana(g);
const scriptIndices=groups.map((_,i)=>i);
function countCards(indices, selection){
 return indices.reduce((total,i)=>total+(!selection||selection.has(i)?groups[i].cards.length:0),0);
}
function categoryIndices(index){
 const [,start,end]=categories[index];
 return scriptIndices.slice(start,end);
}
function updateBulkLabel(button,indices,scope){
 const selection=selected[script];
 const all=indices.every(i=>selection.has(i));
 button.textContent=all?'Clear '+scope:'Select all '+scope;
 button.disabled=!indices.length;
}
function toggleRows(indices){
 const selection=selected[script];
 const all=indices.every(i=>selection.has(i));
 for(const i of indices){
  if(all)selection.delete(i);
  else selection.add(i);
 }
 for(const box of byId('category-panel').querySelectorAll('input[type=checkbox]')){
  box.checked=selection.has(Number(box.dataset.group));
 }
 updateCount();
 save();
}
function updateCount(){
 const selection=selected[script];
 const total=countCards(scriptIndices,selection);
 byId('count').textContent=total+' of '+countCards(scriptIndices)+' kana selected';
 byId('start').disabled=!total;
 updateBulkLabel(byId('bulk-script'),scriptIndices,script);
 updateBulkLabel(byId('bulk-rows'),categoryIndices(category),categories[category][0]);
 categoryTabs.forEach((tab,i)=>{
  const indices=categoryIndices(i), picked=countCards(indices,selection), available=countCards(indices);
  tab.querySelector('.pill-count').textContent=picked+'/'+available;
  tab.setAttribute('aria-label',categories[i][0]+', '+picked+' of '+available+' kana selected');
 });
}
byId('bulk-script').onclick=()=>toggleRows(scriptIndices);
byId('bulk-rows').onclick=()=>toggleRows(categoryIndices(category));
const categories=[['Basic',0,10],['Voiced',10,15],['Combinations',15,groups.length]];
let category=0;
const categoryTabs=categories.map(([title],i)=>{
 const tab=document.createElement('button');
 tab.id='category-'+i;tab.textContent=title;
 const count=document.createElement('span');
 count.className='pill-count';count.setAttribute('aria-hidden','true');tab.append(count);
 tab.setAttribute('role','tab');tab.setAttribute('aria-controls','category-panel');
 tab.onclick=()=>{category=i;render()};
 tab.onkeydown=event=>{
  const destinations={ArrowLeft:(i+2)%3,ArrowRight:(i+1)%3,Home:0,End:2};
  if(!Object.hasOwn(destinations,event.key))return;
  event.preventDefault();category=destinations[event.key];render();categoryTabs[category].focus();
 };
 byId('category-tabs').append(tab);return tab;
});
function render(){

 for(const s of scripts){byId(s).setAttribute('aria-selected',s===script);byId(s).tabIndex=s===script?0:-1}
 byId('panel').setAttribute('aria-labelledby',script);
 byId('script-title').textContent=script;
 for(const sample of fontPicker.querySelectorAll('.font-sample'))sample.textContent=script==='Hiragana'?'あ き さ':'ア キ サ';
 byId('script-icon').textContent=script==='Hiragana'?'あ':'ア';
 categoryTabs.forEach((tab,i)=>{tab.setAttribute('aria-selected',i===category);tab.tabIndex=i===category?0:-1});
 const panel=byId('category-panel');panel.replaceChildren();panel.setAttribute('aria-labelledby',categoryTabs[category].id);
 const [,start,end]=categories[category];
 const grid=document.createElement('div');grid.className='rows';
 panel.append(grid);
 groups.slice(start,end).forEach((group,j)=>{
 const i=start+j,label=document.createElement('label'),box=document.createElement('input'),sample=document.createElement('span'),name=document.createElement('small');
 box.type='checkbox';box.dataset.group=i;box.checked=selected[script].has(i);box.onchange=()=>{if(box.checked)selected[script].add(i);else selected[script].delete(i);updateCount();save()};
 name.textContent=group.cards[0][1];name.className='row-name';sample.className='kana-stack';for(const [base,romaji] of group.cards){const pair=document.createElement('span'),character=document.createElement('span'),reading=document.createElement('span');pair.className='kana-pair';character.lang='ja';character.textContent=glyph(base);reading.className='romaji';reading.textContent=romaji;pair.append(character,reading);sample.append(pair)}label.className='row';label.append(box,sample);box.setAttribute('aria-label',name.textContent);const column=document.createElement('div');column.className='row-column';column.append(name,label);grid.append(column);
 });
 updateCount();
}
for(const s of scripts){byId(s).onclick=()=>{script=s;render();save()};byId(s).onkeydown=e=>{if(['ArrowRight','ArrowLeft','Home','End'].includes(e.key)){e.preventDefault();const dest=e.key==='Home'?scripts[0]:e.key==='End'?scripts[1]:scripts.find(t=>t!==s);byId(dest).click();byId(dest).focus()}}}
const answer=byId('answer'),feedback=byId('feedback');
let deck=[],bag=[],queue=[],current,correct,total,missed,revealed;
function message(text,error=false){feedback.textContent=text;feedback.className=error?'error':''}
function next(){
 if(!bag.length)bag=deck.slice();
 let i=Math.floor(Math.random()*bag.length);if(bag.length>1&&bag[i]===current)i=(i+1)%bag.length;
 const due=queue.findIndex(q=>q.after<=total&&q.card!==current);
 current=due>=0?queue.splice(due,1)[0].card:bag.splice(i,1)[0];
 byId('glyph').textContent=glyph(current[0]);answer.value='';answer.disabled=false;answer.setAttribute('aria-invalid','false');missed=revealed=false;byId('reveal').textContent='Show answer';answer.focus();
}
function score(){total++;if(!missed)correct++;else{queue=queue.filter(q=>q.card!==current);queue.push({card:current,after:total+2})}byId('stats').textContent=correct+' / '+total+' first try'}
function readings([base,r]){
 const forms=[r,...(aliases[base]||[])];if(base.length===2)forms.push(r.replace(/^sh/,'sy').replace(/^ch/,'ty').replace(/^j/,'zy'),r.replace(/^ch/,'cy').replace(/^j/,'jy'));return forms;
}
const answerForm=byId('answer-form');
answerForm.onsubmit=event=>{
 event.preventDefault();
 const value=answer.value.trim().toLowerCase();
 if(revealed||!value)return;
 if(readings(current).includes(value)){
  message('Correct · '+glyph(current[0])+' = '+current[1]);score();next();return;
 }
 missed=true;answer.setAttribute('aria-invalid','true');
 message('Try again or show the answer.',true);answer.focus();answer.select();
};
answer.onkeydown=event=>{
 if(event.key===' '&&!event.isComposing){event.preventDefault();if(!event.repeat)answerForm.requestSubmit()}
};
answer.oninput=()=>{
 if(answer.getAttribute('aria-invalid')==='true'){answer.setAttribute('aria-invalid','false');message('')}
};
byId('reveal').onclick=()=>{if(revealed){message('');next();return}missed=true;score();revealed=true;message(glyph(current[0])+' = '+current[1]);answer.disabled=true;byId('reveal').textContent='Next kana';byId('reveal').focus()};
byId('start').onclick=()=>{
 deck=groups.flatMap((g,i)=>selected[script].has(i)?g.cards:[]);if(!deck.length)return;
 bag=[];queue=[];current=null;correct=total=0;byId('stats').textContent='0 / 0 first try';message('');
 byId('scriptName').textContent=script;byId('reference').replaceChildren();for(const [g,r] of deck){const entry=document.createElement('span');entry.className='entry';entry.textContent=glyph(g)+' '+r;byId('reference').append(entry)}
 document.body.classList.add('practicing');byId('chart').open=false;byId('setup').hidden=true;byId('drill').hidden=false;window.scrollTo(0,0);next();
};
byId('back').onclick=()=>{document.body.classList.remove('practicing');byId('drill').hidden=true;byId('setup').hidden=false;byId(script).focus()};render();

if(location.hash==='#previews'){
 document.documentElement.classList.add('previewing');
 for(const [title,size] of [['Mobile · 390 px','phone'],['Desktop · 1100 px','desktop']]){
  const section=document.createElement('section'),heading=document.createElement('h2'),frame=document.createElement('iframe');
  heading.textContent=title;frame.title=title;frame.className=size;frame.src=location.href.split('#')[0];
  section.append(heading,frame);byId('layout-preview').append(section);
 }
}
</script></body></html>
